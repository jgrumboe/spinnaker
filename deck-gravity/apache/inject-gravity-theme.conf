# Apache configuration for Gravity-themed Deck.
#
# NOTE: The Gravity theme CSS link is injected directly into index.html at
# Docker build time (via sed in the Dockerfile), so mod_substitute is not
# strictly needed at runtime.
#
# This config is kept as a reference in case you want runtime injection
# instead (e.g., if deriving from a pre-built upstream image in the future).

<IfModule mod_substitute.c>
  <IfModule mod_filter.c>
    # Only apply to HTML responses
    FilterDeclare GRAVITY_INJECT
    FilterProvider GRAVITY_INJECT SUBSTITUTE "%{CONTENT_TYPE} =~ m|text/html|"
    FilterChain GRAVITY_INJECT

    # Inject Gravity theme CSS before closing </head>
    Substitute "s|</head>|<link rel=\"stylesheet\" href=\"/gravity-theme.css\" />\n</head>|i"
  </IfModule>
</IfModule>
